<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصفحة غير موجودة — إل جوكر إيجنسي</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F7F5F0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231C1C1A'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='27' font-weight='700' fill='%23F7F5F0' text-anchor='middle'%3EEJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F7F5F0;--surface:#fff;--border:#E7E1D6;--ink:#1C1C1A;--secondary:#6F6A61;--muted:#9A958C}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;line-height:1.9;display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}
.box{max-width:520px;text-align:start}
.code{font-family:Georgia,"Times New Roman",serif;font-size:13px;letter-spacing:.18em;color:var(--muted)}
h1{font-family:"Amiri","Noto Naskh Arabic",Georgia,serif;font-weight:700;font-size:clamp(30px,7vw,42px);line-height:1.35;margin:14px 0 0}
p{color:var(--secondary);font-size:16px;margin:14px 0 0;line-height:1.95}
.btn{display:inline-flex;align-items:center;gap:9px;min-height:46px;margin-top:26px;padding:0 22px;border-radius:999px;background:var(--ink);color:var(--paper);text-decoration:none;font-size:14.5px;font-weight:600}
.btn:hover{background:#000}
a{color:var(--ink);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
.rule{height:1px;background:var(--border);margin:28px 0 20px}
small{color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<main class="box">
  <div class="code">404 — EL JOKER AGENCY</div>
  <h1>الرابط ده مش موجود.</h1>
  <p>الصفحة التي تبحث عنها تم نقلها أو أن الرابط غير صحيح. تقدر ترجع للصفحة الرئيسية، أو تكلمنا على واتساب مباشرة.</p>
  <a class="btn" href="./">العودة للرئيسية</a>
  <div class="rule"></div>
  <small>info@eljoker360.com · القاهرة، مصر</small>
</main>
</body>
</html>
